<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── PRIMARY SEO ───────────────────────────────────────── -->
    <title>Message Received | Free Range Websites</title>
    <meta name="description" content="Thanks for getting in touch. We'll get back to you within one business day." />
    <meta name="robots" content="noindex, nofollow" />

    <!-- ── FAVICON ───────────────────────────────────────────── -->
    <link rel="icon" type="image/png" href="assets/images/favicon.png" />
    <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png" />

    <!-- ── GOOGLE ANALYTICS ──────────────────────────────────── -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-VQDVWQN86F"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-VQDVWQN86F');

      var params = new URLSearchParams(window.location.search);
      var type = params.get('type');

      if (type === 'purchase') {
        gtag('event', 'purchase', {
          currency: 'AUD',
          value: Number(params.get('value')) || 199,
          transaction_id: params.get('tx') || String(Date.now())
        });
      } else if (type === 'intake') {
        gtag('event', 'intake_submitted');
      } else {
        gtag('event', 'conversion', { 'event_category': 'contact', 'event_label': 'form_submitted' });
      }
    </script>

    <!-- ── REDIRECT AFTER 10 SECONDS ─────────────────────────── -->
    <script>
      setTimeout(function(){ window.location.href = '/'; }, 10000);
    </script>

    <!-- ── FONTS ─────────────────────────────────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Encode+Sans+Condensed:wght@400;500;600;700;800;900&family=Encode+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />

    <!-- ── STYLESHEET ────────────────────────────────────────── -->
    <link rel="stylesheet" href="assets/css/styles.css?v=20260780" />
  </head>
  <body>

    <div id="site-header"></div>

    <!-- ── THANK YOU ─────────────────────────────────────────── -->
    <section class="sec pg-hero-pad" style="text-align:center;">
      <div class="container" style="max-width:580px;">
        <div style="font-size:48px;margin-bottom:16px;">👋</div>
        <p class="sec-label">Form received</p>
        <h1 class="sec-title">We'll be in touch soon.</h1>
        <p class="sec-sub">Thanks for reaching out. We'll get back to you at your email address within one business day.</p>
        <p style="margin-top:32px;font-size:14px;color:var(--muted);">Redirecting you to the home page in a few seconds...</p>
        <a href="index.html" style="display:inline-block;margin-top:24px;" class="btn btn-primary" data-ga-cta="thankyou-back-home">Back to home</a>
      </div>
    </section>

    <div id="site-footer"></div>
    <script src="assets/js/includes.js"></script>
  </body>
</html>
